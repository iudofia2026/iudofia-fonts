    :root {
      --bg: #faf9f7;

    * { box-sizing: border-box; }
    body {
      margin: 0;

      font-size: 15px;
      line-height: 1.5;

    .shell {

      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }
    h1 {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 0.35rem;
    }
    .sub {
      font-size: 0.72rem;
      color: var(--muted);
      margin: 0 0 2rem;
      letter-spacing: 0.04em;
    }
    label.switcher-label {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.45rem;

      display: block;
      width: 100%;

      margin: 0 0 1.75rem;
      padding: 0;
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      text-transform: none;
      color: var(--ink);
      background: transparent;
      border: none;
      border-radius: 0;
      outline: none;

      background-position: right 0 center;
      padding-right: 1.25rem;
    }
    select.font-switcher:focus {
      outline: none;
    }
    .preview {
      width: 100%;
      min-height: 12rem;
      padding: 0;
      margin: 0;
      font-size: clamp(1.35rem, 3.2vw, 2rem);
      line-height: 1.35;
      font-weight: 400;
      font-style: normal;
      font-synthesis: none;
      color: var(--ink);
      background: transparent;
      border: none;
      border-radius: 0;
      outline: none;
      resize: vertical;
    }
    .preview:focus { outline: none; }
    .preview::placeholder {
      color: var(--muted);
      opacity: 0.65;
    }
    footer {
      margin-top: 3rem;
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    footer code { font-size: 0.9em; }

        <option value="48">Vactory Sans</option>
    </select>

    <textarea
      id="preview"
      class="preview"
      rows="8"
      autocomplete="off"
      spellcheck="false"
      placeholder="Type here"
    >The quick brown fox jumps over the lazy dog. 0123456789</textarea>

    <footer><code>node scripts/sync-font-catalog.mjs</code> · <code>node scripts/build-index.mjs</code></footer>
  </div>
  <script>
    (function () {
      var names = ["Apercu Mono","Author","Aux Mono","Borgen","Botanica","Britanica Black","Brunson","Cabinet Grotesk","Clash Display","Commune","Duke Plus","Eingrantch Mono","Elron Mono","FH Lecturis","Fira Mono","Fragment Mono","Freight Big","ID Grotesk","II Vorkurs","Kurdis","Manolo Mono","Melodrama","Modernist Milk","Monzane","Neogrotesk","Neogrotesk Sans","Neomatrix Code","Neue Haas Display","Northura","Overpass Mono","PP Neue Montreal","Proto Mono","Ranade","Raygun","Redaction","Saans","Sage","Salmond","Sollarish","Space Mono","Stoned Youth","Suika","Sunflora Sans","Svatopluk","Switzer","Syne Mono","Test The Future","Test The Future Mono","Vactory Sans"];
      var sel = document.getElementById("fontSelect");
      var preview = document.getElementById("preview");
      function applyFont() {
        var i = parseInt(sel.value, 10);
        if (isNaN(i) || !names[i]) return;
        preview.style.fontFamily = JSON.stringify(names[i]) + ", serif";
      }
      sel.addEventListener("change", applyFont);
      applyFont();
    })();
  </script>
